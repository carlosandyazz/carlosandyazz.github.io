<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrullo de Estrellas ✨</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle, #302b63, #0f0c29);
        font-family: Arial, sans-serif;
        overflow: hidden;
        color: white;
    }

    .music-card {
        text-align: center;
        background: rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 25px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 30px rgba(255,255,255,0.2);
    }

    h1 {
        font-size: 32px;
        margin-bottom: 25px;
    }

    .music-button {
        background: linear-gradient(45deg, #ff7eb3, #6a5acd);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .music-button:hover {
        transform: scale(1.08);
        box-shadow: 0 0 20px #ff7eb3;
    }

    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(white 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.3;
        animation: moveStars 20s linear infinite;
    }

    @keyframes moveStars {
        from {
            transform: translateY(0);
        }
        to {
            transform: translateY(40px);
        }
    }
</style>

</head>

<body>

<div class="stars"></div>

<div class="music-card">
    <h1>✨ Arrullo de Estrellas ✨</h1>

    <audio id="cancion">
        <source src="arrullodeestrellas.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <button class="music-button" onclick="reproducir()">
        🎵 Reproducir canción
    </button>
</div>


<script>
    const audio = document.getElementById("cancion");

    function reproducir() {
        if (audio.paused) {
            audio.play();
            document.querySelector(".music-button").innerHTML = "⏸️ Pausar canción";
        } else {
            audio.pause();
            document.querySelector(".music-button").innerHTML = "🎵 Reproducir canción";
        }
    }
</script>

</body>
</html>
